  <style>
    :root {
      --bg-deep:        #0E0D11;
      --bg-canvas:      #14131A;
      --glass:          rgba(20, 18, 22, 0.55);
      --glass-strong:   rgba(28, 24, 30, 0.78);
      --glass-edge:     rgba(255, 255, 255, 0.08);
      --amber:          #C8956C;
      --amber-soft:     #E8B895;
      --amber-deep:     #8A6240;
      --text:           #F5F2EC;
      --text-muted:     #9A928A;
      --text-dim:       #5E5850;
      --critical:       #C84A4A;
      --warn:           #D9A55C;
      --good:           #6CC895;
      --read:           #6C95C8;
      --write:          #6CC895;
      --menu-bar-bg:    rgba(20, 19, 23, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'JetBrains Mono', -apple-system, ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(200, 149, 108, 0.08), transparent 70%),
        radial-gradient(ellipse 100% 60% at 50% 100%, rgba(108, 149, 200, 0.04), transparent 70%),
        var(--bg-deep);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 1;
    }

    #root { position: relative; z-index: 2; }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 64px 80px 120px;
    }

    /* Cover header */
    .cover {
      padding: 80px 0 100px;
      border-bottom: 1px solid var(--glass-edge);
      margin-bottom: 80px;
    }
    .cover-tag {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--amber);
      padding: 4px 10px;
      border: 1px solid var(--amber-deep);
      border-radius: 2px;
      margin-bottom: 24px;
    }
    .cover h1 {
      font-family: 'Fraunces', serif;
      font-weight: 300;
      font-size: 84px;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 12px;
    }
    .cover h1 em {
      font-style: italic;
      font-weight: 300;
      color: var(--amber);
    }
    .cover-sub {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 22px;
      color: var(--text-muted);
      letter-spacing: -0.01em;
      max-width: 720px;
      margin-bottom: 32px;
    }
    .cover-meta {
      display: flex;
      gap: 48px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }
    .cover-meta span b { color: var(--text); font-weight: 500; }

    /* Section header */
    .section { margin-bottom: 120px; }
    .section-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--amber);
      letter-spacing: 0.2em;
      margin-bottom: 12px;
    }
    .section-title {
      font-family: 'Fraunces', serif;
      font-weight: 300;
      font-size: 48px;
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: var(--text);
      margin-bottom: 14px;
    }
    .section-title em { font-style: italic; color: var(--amber); }
    .section-desc {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 17px;
      color: var(--text-muted);
      max-width: 760px;
      margin-bottom: 48px;
      line-height: 1.55;
    }

    /* Glass panel (reusable) */
    .glass {
      background: var(--glass);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--glass-edge);
      border-radius: 20px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.4);
    }

    /* ====================== Section 1: Menu Bar Modes ====================== */
    .menu-bar-stage {
      background: linear-gradient(180deg, rgba(40, 35, 45, 0.6) 0%, rgba(20, 18, 25, 0.6) 100%);
      border-radius: 16px;
      padding: 60px 40px;
      position: relative;
      overflow: hidden;
    }
    .menu-bar-stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(200,149,108,0.12), transparent 60%);
      pointer-events: none;
    }

    .mb-real {
      height: 32px;
      width: 100%;
      background: var(--menu-bar-bg);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 14px;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      position: relative;
    }
    .mb-real-left {
      position: absolute;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      font-size: 13px;
    }
    .mb-real-left .apple { font-size: 14px; }
    .mb-real-left .app-name { font-weight: 500; }
    .mb-real-right { display: flex; align-items: center; gap: 14px; color: #fff; font-size: 13px; }
    .mb-icon { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; opacity: 0.92; }

    /* Status item variants (the only thing that changes per mode) */
    .mb-status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #fff; font-variant-numeric: tabular-nums; }
    .mb-status .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .mb-status .dot-amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
    .mb-status .dot-warn  { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
    .mb-status .dot-good  { background: var(--good); }
    .mb-status .num-amber { color: var(--amber); }
    .mb-status .num-warn  { color: var(--warn); }
    .mb-spark { width: 36px; height: 14px; }

    .mode-row {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 32px;
      align-items: center;
      padding: 32px 0;
      border-bottom: 1px solid var(--glass-edge);
    }
    .mode-row:last-child { border-bottom: 0; }
    .mode-label {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 22px;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .mode-label small {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-style: normal;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .mode-use {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
      letter-spacing: 0.04em;
    }

    /* ====================== Section 2: Disk Detail ====================== */
    .disk-detail-stage {
      padding: 40px;
      background: linear-gradient(180deg, rgba(35, 30, 40, 0.4), rgba(15, 13, 20, 0.6));
      border-radius: 16px;
    }

    .disk-window { background: #1a1820; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 0.5px rgba(255,255,255,0.06); display: grid; grid-template-rows: 38px 1fr; min-height: 720px; }
    .dw-titlebar {
      background: linear-gradient(180deg, #2c2832, #1f1c25);
      display: flex; align-items: center; padding: 0 14px; gap: 8px; border-bottom: 0.5px solid rgba(255,255,255,0.06);
    }
    .dw-light { width: 12px; height: 12px; border-radius: 50%; border: 0.5px solid rgba(0,0,0,0.3); }
    .dw-l-c { background: #ff5f57; }
    .dw-l-m { background: #febc2e; }
    .dw-l-x { background: #28c840; }
    .dw-title { position: absolute; left: 0; right: 0; text-align: center; color: #aaa; font-size: 12px; pointer-events: none; font-family: -apple-system, sans-serif; }
    .dw-titlebar { position: relative; }

    .dw-body { display: grid; grid-template-columns: 280px 1fr; }
    .dw-sidebar { background: rgba(0,0,0,0.25); border-right: 0.5px solid var(--glass-edge); padding: 16px 12px; }
    .dw-sb-section { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 8px 6px; }
    .dw-sb-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s;
    }
    .dw-sb-item:hover { background: rgba(255,255,255,0.04); }
    .dw-sb-item.active { background: rgba(200,149,108,0.12); }
    .dw-sb-item.active .dw-sb-name { color: var(--amber-soft); }
    .dw-sb-icon { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }
    .dw-sb-item.active .dw-sb-icon { color: var(--amber); }
    .dw-sb-name { font-size: 13px; color: var(--text); flex: 1; font-family: -apple-system, sans-serif; }
    .dw-sb-meta { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
    .dw-sb-badge { width: 6px; height: 6px; border-radius: 50%; }

    .dw-main { padding: 24px 28px 32px; overflow: hidden; }
    .dw-breadcrumb { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); letter-spacing: 0.06em; margin-bottom: 18px; }
    .dw-breadcrumb span { color: var(--text-muted); }
    .dw-breadcrumb em { color: var(--amber); font-style: normal; }

    .dw-hero {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 28px;
      align-items: center;
      padding: 24px 28px;
      background: linear-gradient(135deg, rgba(200,149,108,0.07), rgba(200,149,108,0.02));
      border: 1px solid var(--glass-edge);
      border-radius: 16px;
      margin-bottom: 24px;
    }
    .dw-hero-title { font-family: 'Fraunces', serif; font-weight: 400; font-size: 28px; letter-spacing: -0.02em; color: var(--text); margin-bottom: 4px; }
    .dw-hero-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); letter-spacing: 0.06em; }

    /* Health ring */
    .health-ring { position: relative; width: 96px; height: 96px; }
    .health-ring svg { transform: rotate(-90deg); }
    .health-ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .health-ring-pct { font-family: 'Fraunces', serif; font-weight: 400; font-size: 22px; color: var(--good); letter-spacing: -0.02em; }
    .health-ring-label { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-dim); letter-spacing: 0.16em; text-transform: uppercase; margin-top: 2px; }

    .dw-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      padding: 16px 18px;
      background: var(--glass-strong);
      border: 1px solid var(--glass-edge);
      border-radius: 14px;
      backdrop-filter: blur(20px);
    }
    .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .stat-label .pip { width: 4px; height: 4px; border-radius: 50%; background: var(--amber); }
    .stat-value { font-family: 'Fraunces', serif; font-weight: 300; font-size: 32px; color: var(--text); letter-spacing: -0.02em; line-height: 1; }
    .stat-value sup, .stat-value .unit { font-size: 14px; color: var(--text-muted); font-weight: 400; margin-left: 2px; }
    .stat-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.04em; }
    .stat-sub .ok { color: var(--good); }
    .stat-sub .warn { color: var(--warn); }
    .stat-sub .crit { color: var(--critical); }

    .dw-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .chart-card {
      padding: 18px 20px;
      background: var(--glass-strong);
      border: 1px solid var(--glass-edge);
      border-radius: 14px;
      backdrop-filter: blur(20px);
    }
    .chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .chart-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: 16px; color: var(--text); }
    .chart-tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.12em; text-transform: uppercase; }

    .chart-svg { width: 100%; height: 80px; }

    .chart-legend { display: flex; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); margin-top: 8px; }
    .chart-legend .sw { display: inline-block; width: 8px; height: 2px; vertical-align: middle; margin-right: 5px; }

    .dw-bottom { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
    .smart-card { padding: 18px 20px; background: var(--glass-strong); border: 1px solid var(--glass-edge); border-radius: 14px; backdrop-filter: blur(20px); }
    .smart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .smart-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: 16px; color: var(--text); }
    .smart-table { width: 100%; border-collapse: collapse; }
    .smart-table tr { border-bottom: 0.5px solid var(--glass-edge); }
    .smart-table tr:last-child { border-bottom: 0; }
    .smart-table td { padding: 7px 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; vertical-align: middle; }
    .smart-table td:first-child { color: var(--text-dim); width: 50%; }
    .smart-table td:nth-child(2) { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
    .smart-table td:last-child { color: var(--amber); text-align: right; font-size: 10px; width: 60px; padding-left: 12px; }

    .pie-card { padding: 18px 20px; background: var(--glass-strong); border: 1px solid var(--glass-edge); border-radius: 14px; backdrop-filter: blur(20px); display: flex; flex-direction: column; }
    .pie-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .pie-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: 16px; color: var(--text); }
    .pie-body { display: flex; align-items: center; gap: 18px; flex: 1; }
    .pie-svg { width: 110px; height: 110px; flex-shrink: 0; }
    .pie-legend { flex: 1; }
    .pie-row { display: flex; justify-content: space-between; padding: 4px 0; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
    .pie-row .label { color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .pie-row .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .pie-row .val { color: var(--text); font-variant-numeric: tabular-nums; }
    .pie-total { font-family: 'Fraunces', serif; font-weight: 300; font-size: 26px; color: var(--text); letter-spacing: -0.02em; margin-top: 6px; }
    .pie-total-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.12em; text-transform: uppercase; }

    /* ====================== Section 3: ControlWidget ====================== */
    .control-stage {
      background: linear-gradient(180deg, #0a0a0e 0%, #1a1820 100%);
      border-radius: 16px;
      padding: 48px 40px;
      position: relative;
      overflow: hidden;
    }
    .control-stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 0%, rgba(108,149,200,0.08), transparent 60%);
      pointer-events: none;
    }
    .control-title {
      text-align: center;
      font-family: -apple-system, "SF Pro Display", sans-serif;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .control-frame {
      max-width: 720px;
      margin: 0 auto;
      background: rgba(20, 18, 25, 0.7);
      backdrop-filter: blur(60px) saturate(180%);
      border-radius: 28px;
      padding: 28px 32px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
    }
    .control-section { margin-bottom: 22px; }
    .control-section-label {
      font-family: -apple-system, sans-serif;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .control-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .ctl-widget {
      aspect-ratio: 2 / 1;
      border-radius: 16px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    .ctl-widget:hover { background: rgba(255,255,255,0.1); }
    .ctl-widget.diskmon { background: linear-gradient(135deg, rgba(200,149,108,0.18), rgba(200,149,108,0.04)); border-color: rgba(200,149,108,0.25); }
    .ctl-widget.wide { grid-column: span 2; }
    .ctl-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .ctl-icon { width: 22px; height: 22px; }
    .ctl-icon-amber { color: var(--amber); }
    .ctl-name { font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 600; color: #fff; }
    .ctl-name small { display: block; font-size: 9px; font-weight: 400; color: rgba(255,255,255,0.6); margin-top: 2px; letter-spacing: 0.04em; }

    .diskmon-ctl-body { display: flex; flex-direction: column; gap: 4px; }
    .diskmon-ctl-stats { display: flex; align-items: baseline; gap: 6px; }
    .diskmon-ctl-num { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 400; color: #fff; letter-spacing: -0.02em; }
    .diskmon-ctl-unit { font-size: 10px; color: rgba(255,255,255,0.5); }
    .diskmon-ctl-spark { width: 100%; height: 20px; margin-top: 2px; }

    /* ====================== Section 4: App Icons ====================== */
    .icon-stage { padding: 40px; background: linear-gradient(180deg, rgba(35, 30, 40, 0.4), rgba(15, 13, 20, 0.6)); border-radius: 16px; }
    .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
    .icon-cell { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .icon-tile { width: 128px; height: 128px; position: relative; box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 0 0 0.5px rgba(255,255,255,0.06); transition: transform 0.2s; }
    .icon-tile:hover { transform: translateY(-3px) scale(1.02); }
    .icon-tile svg { width: 100%; height: 100%; display: block; border-radius: 28.4%; }
    .icon-name { font-family: 'Fraunces', serif; font-style: italic; font-size: 14px; color: var(--text); text-align: center; }
    .icon-num { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.18em; }

    /* ====================== Section 5: Popover ====================== */
    .popover-stage {
      background: linear-gradient(180deg, rgba(35, 30, 40, 0.4), rgba(15, 13, 20, 0.6));
      border-radius: 16px;
      padding: 60px 40px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 60px;
    }
    .popover-arrow {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--text-muted);
      max-width: 260px;
      line-height: 1.6;
      padding-top: 40px;
    }
    .popover-arrow b { color: var(--amber); font-weight: 400; }

    .popover {
      width: 380px;
      background: var(--glass-strong);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--glass-edge);
      border-radius: 20px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .pop-header { padding: 16px 18px 12px; border-bottom: 0.5px solid var(--glass-edge); display: flex; align-items: center; justify-content: space-between; }
    .pop-title { font-family: 'Fraunces', serif; font-weight: 400; font-style: italic; font-size: 16px; color: var(--text); }
    .pop-version { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.12em; }
    .pop-body { padding: 14px 18px 18px; }
    .pop-hero { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .pop-temp { font-family: 'Fraunces', serif; font-weight: 300; font-size: 56px; line-height: 1; color: var(--amber); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .pop-temp sup { font-size: 18px; color: var(--amber-soft); margin-left: 2px; vertical-align: top; line-height: 1.6; }
    .pop-temp-meta { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
    .pop-temp-meta .label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.14em; text-transform: uppercase; }
    .pop-temp-meta .val { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text); }
    .pop-temp-meta .val.amber { color: var(--amber); }

    /* New: Power card (v0.2.0) */
    .pop-power {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(200,149,108,0.08);
      border: 0.5px solid rgba(200,149,108,0.2);
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .pop-power-icon { width: 20px; height: 20px; color: var(--amber); flex-shrink: 0; }
    .pop-power-text { flex: 1; }
    .pop-power-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.14em; text-transform: uppercase; }
    .pop-power-val { font-family: 'Fraunces', serif; font-weight: 400; font-size: 18px; color: var(--amber-soft); font-variant-numeric: tabular-nums; line-height: 1.1; }
    .pop-power-val small { font-size: 11px; color: var(--text-muted); margin-left: 2px; font-family: 'JetBrains Mono', monospace; }
    .pop-power-delta { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--good); }
    .pop-power-delta.warn { color: var(--warn); }

    /* Disk rows */
    .pop-disks { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .pop-disk { display: grid; grid-template-columns: 20px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 0.5px solid var(--glass-edge); }
    .pop-disk:last-child { border-bottom: 0; }
    .pop-disk-icon { color: var(--text-muted); }
    .pop-disk-icon.warn { color: var(--warn); }
    .pop-disk-name { font-family: -apple-system, sans-serif; font-size: 12px; color: var(--text); }
    .pop-disk-name small { display: block; font-size: 9px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin-top: 1px; }
    .pop-disk-temp { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; min-width: 50px; text-align: right; }
    .pop-disk-temp.warn { color: var(--warn); }
    .pop-disk-power { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); min-width: 50px; text-align: right; }
    .pop-disk-power b { color: var(--amber-soft); font-weight: 500; }

    /* New: 24h power sparkline */
    .pop-spark-section { padding: 12px 0; border-top: 0.5px solid var(--glass-edge); margin-bottom: 12px; }
    .pop-spark-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .pop-spark-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.14em; text-transform: uppercase; }
    .pop-spark-val { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); }
    .pop-spark-val b { color: var(--amber-soft); font-weight: 500; }
    .pop-spark-svg { width: 100%; height: 36px; }

    .pop-footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px 0; }
    .pop-btn {
      font-family: -apple-system, sans-serif;
      font-size: 12px;
      color: var(--text-muted);

</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    // ============== macos_window.jsx (skill asset) — adapted inline ==============
    function MacosWindow({ title = '', width = 900, height = 600, darkMode = true, children, style }) {
      const s = {
        window: {
          display: 'inline-block',
          background: darkMode ? '#1a1820' : '#fff',

              <div style={{ width: 12, height: 12, borderRadius: '50%', background: '#febc2e', border: '0.5px solid rgba(0,0,0,0.2)' }} />

            {title && <div style={s.title}>{title}</div>}
          </div>
          <div style={{ width, height, position: 'relative' }}>
            {children}
          </div>
        </div>
      );
    }

    // ============== SF Symbol-as-SVG (use simple geometric icons, no emoji) ==============
    const Icon = ({ name, size = 16, color = 'currentColor' }) => {
      const s = { width: size, height: size, display: 'inline-block', verticalAlign: 'middle' };
      switch (name) {
        case 'externaldrive':
          return (<svg viewBox="0 0 24 24" style={s} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <line x1="3" y1="10" x2="21" y2="10" />
            <circle cx="17" cy="14" r="0.5" fill={color} />
          </svg>);
        case 'externaldrive.fill':
          return (<svg viewBox="0 0 24 24" style={s} fill={color} stroke="none">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <rect x="3" y="9" width="18" height="2" fill="rgba(0,0,0,0.18)" />
            <circle cx="17" cy="14" r="0.8" fill="rgba(255,255,255,0.4)" />
          </svg>);
        case 'thermometer':
          return (<svg viewBox="0 0 24 24" style={s} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 4a2 2 0 0 0-2 2v9a4 4 0 1 0 4 0V6a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="16.5" r="2" fill={color} />
          </svg>);
        case 'bolt':
          return (<svg viewBox="0 0 24 24" style={s} fill={color}>
            <path d="M13 2L4 14h7l-1 8 9-12h-7z" />
          </svg>);
        case 'wifi':
          return (<svg viewBox="0 0 24 24" style={s} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round">
            <path d="M2 9c5.5-5 14.5-5 20 0" /><path d="M5 12.5c4-3.5 10-3.5 14 0" /><path d="M8.5 16c2-1.5 5-1.5 7 0" /><circle cx="12" cy="19" r="1" fill={color} />
          </svg>);
        case 'bluetooth':
          return (<svg viewBox="0 0 24 24" style={s} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round">
            <path d="M6 6l12 12-6 6V4l6 6L6 20" />
          </svg>);
        case 'airdrop':
          return (<svg viewBox="0 0 24 24" style={s} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round">
            <path d="M5 16c4-6 10-6 14 0" /><path d="M8 13c3-3 5-3 8 0" /><path d="M11 10c1-1 1-1 2 0" /><circle cx="12" cy="19" r="1" fill={color} />
          </svg>);
        case 'battery.100':
          return (<svg viewBox="0 0 26 14" style={s} fill="none" stroke={color} strokeWidth="1">
            <rect x="0.5" y="0.5" width="22" height="13" rx="3" />
            <rect x="23" y="4" width="2.5" height="6" rx="1" fill={color} stroke="none" />
            <rect x="2" y="2" width="19" height="10" rx="1.5" fill={color} stroke="none" />
          </svg>);
        case 'speaker.wave.3':
          return (<svg viewBox="0 0 24 24" style={s} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round">
            <path d="M4 9h3l5-4v14l-5-4H4z" fill={color} />
            <path d="M16 8a4 4 0 0 1 0 8" /><path d="M18.5 5.5a8 8 0 0 1 0 13" />
          </svg>);
        case 'moon.fill':
          return (<svg viewBox="0 0 24 24" style={s} fill={color}>
            <path d="M21 13a9 9 0 0 1-10-10 9 9 0 1 0 10 10z" />
          </svg>);
        case 'gear':
          return (<svg viewBox="0 0 24 24" style={s} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round">
            <circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>);
        case 'chart.line':
          return (<svg viewBox="0 0 24 24" style={s} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round">
            <path d="M3 18l5-6 4 3 7-9" />
          </svg>);
        case 'chart.pie':
          return (<svg viewBox="0 0 24 24" style={s} fill="none" stroke={color} strokeWidth="1.5">
            <path d="M21 12A9 9 0 1 1 12 3v9z" fill={color} stroke="none" opacity="0.8" />
            <path d="M21 12A9 9 0 0 0 12 3v9h9z" />
          </svg>);
        case 'lock':
          return (<svg viewBox="0 0 24 24" style={s} fill="none" stroke={color} strokeWidth="1.5">
            <rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>);
        case 'arrow.up.right':
          return (<svg viewBox="0 0 24 24" style={s} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round">
            <path d="M7 17L17 7" /><path d="M8 7h9v9" />
          </svg>);
        default: return null;
      }
    };

    // ============== Helpers ==============
    const Sparkline = ({ data, color = '#C8956C', w = 80, h = 24, stroke = 1.5, fillOpacity = 0.15, showArea = true }) => {
      if (!data || data.length === 0) return null;
      const min = Math.min(...data);
      const max = Math.max(...data);
      const range = max - min || 1;
      const step = w / (data.length - 1);
      const pts = data.map((v, i) => [i * step, h - ((v - min) / range) * (h - 4) - 2]);
      const path = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
      const area = `${path} L${w},${h} L0,${h} Z`;
      return (
        <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: '100%', height: h }}>
          {showArea && <path d={area} fill={color} fillOpacity={fillOpacity} stroke="none" />}
          <path d={path} stroke={color} strokeWidth={stroke} fill="none" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    };

    // ============== Section 1: Menu Bar Status Modes ==============
    const Section1 = () => {
      // 24h temp data, peak around 14:00
      const tempData = [33, 33, 34, 34, 35, 35, 36, 36, 36, 37, 38, 39, 41, 40, 38, 36, 35, 35, 36, 36, 35, 34, 34, 33];

      const MBMenuBar = ({ children }) => (

          </div>

            <span className="mb-icon"><Icon name="battery.100" size={20} color="#fff" /></span>
            <span className="mb-icon"><Icon name="wifi" size={14} color="#fff" /></span>
            <span style={{ fontSize: 12 }}>Wed Sep 1 18:16</span>
            {children}
          </div>
        </div>
      );

      return (
        <div className="section anchor" id="sec1">
          <div className="anchor-id" />
          <div className="section-num">SECTION 01 / 05</div>
          <h2 className="section-title">菜单栏 <em>Status Item</em> 多模式</h2>
          <p className="section-desc">
            macOS 菜单栏右侧 4 种 status item 形态 — 用户在 v0.2.0 Settings → Menu Bar Mode 里切换。
            设计原则:克制 vs 信息密度;默认 D(全 OK),Warning 触发时自动切 A 给最热盘。
          </p>

          <div className="menu-bar-stage">
            <div className="mode-row">
              <div>
                <div className="mode-label"><small>MODE A</small>温度优先</div>
                <div className="mode-use">用 户场景:随时看最热盘温度。Warning 触发时系统自动切这个。</div>
              </div>
              <MBMenuBar>
                <span className="mb-status">
                  <Icon name="thermometer" size={14} color="#C8956C" />
                  <span className="num-amber">41</span>
                  <span style={{ fontSize: 11, color: 'var(--amber)' }}>°C</span>
                </span>
              </MBMenuBar>
            </div>

            <div className="mode-row">
              <div>
                <div className="mode-label"><small>MODE B</small>健康度优先</div>
                <div className="mode-use">用户场景:多盘用户一眼看 "2 Good / 1 Warning"。</div>
              </div>
              <MBMenuBar>
                <span className="mb-status">
                  <span className="dot dot-good"></span>
                  <span>2</span>
                  <span style={{ opacity: 0.5, fontSize: 11 }}>·</span>
                  <span className="dot dot-warn"></span>
                  <span>1</span>
                </span>
              </MBMenuBar>
            </div>

            <div className="mode-row">
              <div>
                <div className="mode-label"><small>MODE C</small>Sparkline</div>
                <div className="mode-use">用户场景:看 24h 趋势 — 高烧期 / idle 期一眼判。</div>
              </div>
              <MBMenuBar>
                <span className="mb-status">
                  <span className="mb-spark">
                    <Sparkline data={tempData} color="#C8956C" w={36} h={14} stroke={1.3} fillOpacity={0.25} />
                  </span>
                  <span className="num-amber" style={{ fontSize: 12 }}>36°</span>
                </span>
              </MBMenuBar>
            </div>

            <div className="mode-row">
              <div>
                <div className="mode-label"><small>MODE D</small>整体 OK</div>
                <div className="mode-use">默认态。3 盘全 Good 时,只剩 1 个 SF Symbol + 点。最克制。</div>
              </div>
              <MBMenuBar>
                <span className="mb-status">
                  <Icon name="externaldrive.fill" size={16} color="#fff" />
                  <span className="dot dot-good"></span>
                </span>
              </MBMenuBar>
            </div>
          </div>
        </div>
      );
    };

    // ============== Section 2: Disk Detail Deep View ==============
    const Section2 = () => {
      const temp24h = [33, 33, 34, 34, 35, 35, 36, 36, 36, 37, 38, 39, 41, 40, 38, 36, 35, 35, 36, 36, 35, 34, 34, 33];
      const power24h = [0.8, 0.8, 0.8, 0.9, 1.2, 1.5, 2.1, 2.8, 3.4, 4.2, 4.0, 3.5, 4.2, 3.8, 2.5, 1.8, 1.2, 0.9, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8];

      // Health ring 95%
      const HealthRing = ({ pct = 95 }) => {
        const r = 38, c = 2 * Math.PI * r;
        const offset = c - (pct / 100) * c;
        return (
          <div className="health-ring">
            <svg viewBox="0 0 96 96" width="96" height="96">
              <circle cx="48" cy="48" r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="6" />
              <circle cx="48" cy="48" r={r} fill="none" stroke="#6CC895" strokeWidth="6" strokeLinecap="round"
                strokeDasharray={c} strokeDashoffset={offset} />
            </svg>
            <div className="health-ring-text">
              <div className="health-ring-pct">{pct}</div>
              <div className="health-ring-label">% HEALTH</div>
            </div>
          </div>
        );
      };

      const PieCapacity = () => {
        // 3 partitions: free 38%, photos 32%, projects 18%, system 12%
        const data = [
          { label: 'Free Space', val: '380 GB', pct: 38, color: '#3a3742' },
          { label: 'Active Projects', val: '320 GB', pct: 32, color: '#C8956C' },
          { label: 'Photos Library', val: '180 GB', pct: 18, color: '#8A6240' },
          { label: 'System / Backups', val: '120 GB', pct: 12, color: '#6C95C8' },
        ];
        const r = 40, cx = 55, cy = 55;
        let acc = 0;
        return (
          <>
            <svg viewBox="0 0 110 110" className="pie-svg">
              {data.map((d, i) => {
                const start = (acc / 100) * 2 * Math.PI;
                acc += d.pct;
                const end = (acc / 100) * 2 * Math.PI;
                const x1 = cx + r * Math.sin(start), y1 = cy - r * Math.cos(start);
                const x2 = cx + r * Math.sin(end), y2 = cy - r * Math.cos(end);

                return <path key={i} d={`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`} fill={d.color} stroke="rgba(20,18,22,0.6)" strokeWidth="1" />;

              <div className="pie-total">1.0 TB</div>
              <div className="pie-total-sub">TOTAL CAPACITY</div>
            </div>

          <div className="anchor-id" />
          <div className="section-num">SECTION 02 / 05</div>
          <h2 className="section-title">磁盘详情 <em>深看页</em></h2>
          <p className="section-desc">

            + 2 个 24h 图表(温度 + 功耗)+ SMART 表 + 容量饼图。
            v0.2.0 重点:<b style={{color:'#C8956C', fontStyle:'normal'}}>实时功耗</b>(smartctl Power Consumption / IOKit)。
          </p>

          <div className="disk-detail-stage">
            <div className="disk-window">
              <div className="dw-titlebar">
                <div className="dw-light dw-l-c" />
                <div className="dw-light dw-l-m" />
                <div className="dw-light dw-l-x" />
                <div className="dw-title">diskmon — Deep View</div>
              </div>

              <div className="dw-body">
                <div className="dw-sidebar">
                  <div className="dw-sb-section">External Volumes</div>
                  <div className="dw-sb-item active">
                    <span className="dw-sb-icon"><Icon name="externaldrive.fill" size={18} color="#C8956C" /></span>

                    <span className="dw-sb-badge" style={{ background: '#D9A55C' }} />
                  </div>
                  <div className="dw-sb-section" style={{ marginTop: 12 }}>Internal</div>

                <div className="dw-main">

                    External / <span>applelog</span> / <em>Deep View</em>
                  </div>

                  <div className="dw-hero">

                        <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 10, color: 'var(--text-dim)', padding: '3px 8px', border: '0.5px solid var(--glass-edge)', borderRadius: 4, letterSpacing: '0.1em' }}>TB4 · 40 Gb/s</span>

                      </div>
                    </div>
                  </div>

                  <div className="dw-stats">
                    <div className="stat-card">
                      <div className="stat-label"><span className="pip" />Temperature</div>
                      <div className="stat-value">36<span className="unit">°C</span></div>
                      <div className="stat-sub">peak 41°C at 14:00 · <span className="ok">nominal</span></div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label"><span className="pip" style={{background: '#6C95C8'}} />Capacity</div>
                      <div className="stat-value">62<span class className="unit">%</span></div>
                      <div className="stat-sub">620 GB / 1.0 TB used</div>

                    <div className="stat-card" style={{ borderColor: 'rgba(200,149,108,0.3)', background: 'linear-gradient(135deg, rgba(200,149,108,0.08), rgba(200,149,108,0.02))' }}>

                  <div className="dw-charts">

                      </div>

    // ============== Section 3: ControlWidget ==============
